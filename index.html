<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FUTURE_FS_02 - Mini CRM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: #38bdf8;
      margin-bottom: 20px;
    }

    .container {
      width: 90%;
      margin: auto;
    }

    form {
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      width: 200px;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: white;
    }

    .add-btn {
      background: #22c55e;
    }

    .add-btn:hover {
      background: #16a34a;
    }

    .status-btn {
      background: orange;
      margin: 2px;
    }

    .delete-btn {
      background: red;
      margin: 2px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      color: black;
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 12px;
      border: 1px solid #ddd;
    }

    th {
      background: #38bdf8;
      color: white;
    }

    tr:hover {
      background: #f1f5f9;
    }
  </style>

</head>

<body>

  <h1>Client Lead Management System</h1>

  <div class="container">

```
<form id="leadForm">
  <input type="text" id="name" placeholder="Enter Name" required>
  <input type="email" id="email" placeholder="Enter Email" required>
  <input type="text" id="source" placeholder="Enter Source" required>
  <button type="submit" class="add-btn">Add Lead</button>
</form>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Source</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="leadTable"></tbody>
</table>
```

  </div>

  <script>
    let leads = JSON.parse(localStorage.getItem("leads")) || [];

    function saveLeads() {
      localStorage.setItem("leads", JSON.stringify(leads));
    }

    function displayLeads() {
      const table = document.getElementById("leadTable");
      table.innerHTML = "";

      leads.forEach((lead, index) => {
        table.innerHTML += `
          <tr>
            <td>${lead.name}</td>
            <td>${lead.email}</td>
            <td>${lead.source}</td>
            <td>${lead.status}</td>
            <td>
              <button class="status-btn" onclick="updateStatus(${index})">Change</button>
              <button class="delete-btn" onclick="deleteLead(${index})">Delete</button>
            </td>
          </tr>
        `;
      });
    }

    document.getElementById("leadForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const source = document.getElementById("source").value;

      const newLead = {
        name: name,
        email: email,
        source: source,
        status: "New"
      };

      leads.push(newLead);
      saveLeads();
      displayLeads();

      this.reset();
    });

    function updateStatus(index) {
      const order = ["New", "Contacted", "Converted"];
      let current = leads[index].status;
      let next = order[(order.indexOf(current) + 1) % order.length];
      leads[index].status = next;

      saveLeads();
      displayLeads();
    }

    function deleteLead(index) {
      leads.splice(index, 1);
      saveLeads();
      displayLeads();
    }

    displayLeads();
  </script>

</body>
</html>
